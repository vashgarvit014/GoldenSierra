services:
  postgres:
    image: postgres:16-alpine
    container_name: gs-postgres
    environment:
      POSTGRES_USER: gs
      POSTGRES_PASSWORD: gs
      POSTGRES_DB: goldensierra
    ports: ['5433:5432']
    volumes: ['gs-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gs -d goldensierra']
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: gs-qdrant
    ports: ['6333:6333', '6334:6334']
    volumes: ['gs-qdrant:/qdrant/storage']

  redis:
    image: redis:7-alpine
    container_name: gs-redis
    ports: ['6379:6379']
    volumes: ['gs-redis:/data']

volumes:
  gs-pgdata:
  gs-qdrant:
  gs-redis:
